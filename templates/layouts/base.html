{{define "base"}}
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{block "title" .}}Go Blue Bird Base Template{{end}}</title>
    <link rel="stylesheet" href="/public/css/bluebird.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>

<body>
    <div class="app-layout">
        <header class="navbar">
            <div class="nav-container">
                <a href="/" class="brand-logo">
                    <span class="brand-icon">⚡</span>
                    <span class="brand-name">Go Blue Bird</span>
                </a>
                <nav class="nav-links">
                    <a href="/" class="nav-item">Home</a>
                    <a href="/about" class="nav-item">About</a>
                    <a href="/api/v1/health" target="_blank" class="nav-item badge">API Health</a>
                </nav>
            </div>
        </header>

        <main class="main-content">
            {{template "content" .}}
        </main>

        <footer class="footer">
            <div class="footer-container">
                <p>&copy; 2026 Go Blue Bird Starter Kit. Built with Go & Gin Framework.</p>
            </div>
        </footer>
    </div>
    <script src="/public/js/bluebird.js"></script>
</body>

</html>
{{end}}
